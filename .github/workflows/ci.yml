name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"            # cache pip based on requirements.txt hash

      - name: Upgrade pip
        run: python -m pip install -U pip

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install CI tooling
        run: pip install -U ruff mypy pytest pytest-cov types-requests types-PyYAML

      # Pre-install any additional types mypy may request (non-interactive)
      - name: Prepare mypy types
        run: mypy --install-types --non-interactive || true

      - name: Ruff Lint
        run: ruff check .

      - name: Ruff Format (check only)
        run: ruff format --check .

      - name: Type check
        run: mypy .

      - name: Run tests
        run: pytest --cov=. --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml